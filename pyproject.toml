[project]
name = "storage-analyzer"
version = "0.1.0"
description = "Finds what is using your disk space, sorts it by what is safe to delete, and cleans it up. Built around WizTree, with an optional Claude Code helper."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = ["License :: Other/Proprietary License", "Operating System :: Microsoft :: Windows",
               "Programming Language :: Python :: 3.12"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "send2trash>=1.8",
]

[project.scripts]
storage-analyzer = "storage_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storage_analyzer"]

[tool.ruff]
line-length = 110
target-version = "py312"
